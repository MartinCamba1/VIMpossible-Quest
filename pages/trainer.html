<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>VIMpossible Quest</title>
    <link rel="stylesheet" href="../css/trainer.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div class="trainer-layout">
      
      <div id="left-sidebar">
        <div id="left-sidebar-content">
          <div class="sidebar-name">
            <span class="sidebar-text">VIMpossible<br> Quest</span>
          </div>
          <hr>
          <a href="../index.html" target="_self" class="sidebar-item-link">
            <div class="sidebar-item">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="svg-icon">
                <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
              </svg>
              <span class="sidebar-text">Home</span>
            </div>
          </a>
        </div>
      </div>

      <main id="main-layout">
        <div id="round-stats">
          <span id="round-num" class="stat">Round: 1</span>
          <span id="time-left" class="stat">1:00</span>
          <span id="points-num" class="stat">Points: 0</span>
        </div>

        <dialog id="terminal-dialog" open>
            <h2 id="dialog-title" class="centered dialog-text">Ready to begin ?</h2>

            <p class="dialog-message centered dialog-text">Your task is to complete all of the challenges before the time runs out.</p>
            <p class="dialog-message centered dialog-text">Playing the tutorial at least once is recommended.</p>

            <div id="dialog-stats">

            </div>
            <div class="button-container">
              <button id="start-tutorial-btn" class="button">
                <span id="start-tutorial-text">Try the Tutorial!</span>
              </button>
              <button id="start-round-btn" class="button">
                <span id="start-round-text">Start the round!</span>
              </button>
          </dialog>
        <div id="vim-terminal-container">
          <div id="mode-container">
            <p id="mode-text">NORMAL</p>
          </div>
          <div id="vim-terminal">
            <p id="terminal-text"></p>
          </div>
        </div>
      </main>

      <div id="right-sidebar">
        <div id="right-sidebar-content">
          <div class="sidebar-name">
            <span class="sidebar-text">Unlocked Commands</span>
          </div>
          <hr>
          <div id="unlocked-commands">
            <div class="command">h</div>
            <div class="command">j</div>
            <div class="command">k</div>
            <div class="command">l</div>
            <div class="command">dd</div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="../js/index.js"></script>
  </body>
</html>
